@if (data.length === 0) {
  <p class="empty-state">{{ emptyMessage }}</p>
} @else {
  <table mat-table [dataSource]="data" class="data-table">
    @for (column of columns; track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef [class.numeric]="column.numeric">
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let row" [class.numeric]="column.numeric">
          {{ column.cell(row) }}
        </td>
      </ng-container>
    }

    @if (actions.length > 0) {
      <ng-container [matColumnDef]="actionsColumn">
        <th mat-header-cell *matHeaderCellDef class="numeric"></th>
        <td mat-cell *matCellDef="let row" class="numeric actions-cell">
          @for (action of actions; track action.label) {
            <button
              mat-icon-button
              [color]="action.color"
              [attr.aria-label]="action.label"
              [matTooltip]="action.label"
              (click)="action.handler(row)"
            >
              <mat-icon>{{ action.icon }}</mat-icon>
            </button>
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
