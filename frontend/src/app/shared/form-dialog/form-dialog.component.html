<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <ng-content />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" type="submit">{{ submitLabel }}</button>
</mat-dialog-actions>
