<div class="page-header">
  <div>
    <h1>Optimizer</h1>
    <p>The combination of recipes that feeds the most people with the ingredients in stock.</p>
  </div>
  <button mat-flat-button color="primary" (click)="optimize()" [disabled]="loading()">
    <mat-icon>calculate</mat-icon>
    Recalculate
  </button>
</div>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (error()) {
  <div class="alert alert--error">{{ error() }}</div>
}

@if (result(); as plan) {
  <mat-card appearance="raised" class="result-hero">
    <span class="result-hero__label">People fed</span>
    <span class="result-hero__value">{{ plan.totalPeopleFed }}</span>
  </mat-card>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Recipes to make</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-data-table
        [columns]="selectionColumns"
        [data]="plan.selections"
        emptyMessage="No recipes can be made with the current ingredients."
      />
    </mat-card-content>
  </mat-card>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Ingredient usage</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-data-table
        [columns]="usageColumns"
        [data]="plan.ingredientUsages"
        emptyMessage="No ingredients in stock."
      />
    </mat-card-content>
  </mat-card>
}
