<div class="page-header">
  <div>
    <h1>Ingredients</h1>
    <p>Manage the pantry: the ingredients available and how much of each is in stock.</p>
  </div>
  <button mat-flat-button color="primary" (click)="openDialog()">
    <mat-icon>add</mat-icon>
    Add ingredient
  </button>
</div>

@if (error()) {
  <div class="alert alert--error">{{ error() }}</div>
}

<mat-card appearance="outlined">
  <mat-card-content>
    <app-data-table
      [columns]="columns"
      [data]="ingredients()"
      [actions]="actions"
      emptyMessage="No ingredients yet. Add one to get started."
    />
  </mat-card-content>
</mat-card>
