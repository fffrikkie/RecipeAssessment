<h2 mat-dialog-title>{{ isEditing ? 'Edit ingredient' : 'Add ingredient' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <div class="dialog-fields">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. Tomato" cdkFocusInitial />
        @if (form.controls.name.hasError('required')) {
          <mat-error>A name is required.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Available amount</mat-label>
        <input matInput type="number" min="0" formControlName="availableAmount" />
        @if (form.controls.availableAmount.invalid) {
          <mat-error>Must be 0 or more.</mat-error>
        }
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      {{ isEditing ? 'Save changes' : 'Add' }}
    </button>
  </mat-dialog-actions>
</form>
