<div class="page-header">
  <div>
    <h1>Recipes</h1>
    <p>Define the dishes that can be made, the ingredients each consumes, and how many people it feeds.</p>
  </div>
  <button mat-flat-button color="primary" (click)="openDialog()">
    <mat-icon>add</mat-icon>
    Add recipe
  </button>
</div>

<mat-card appearance="outlined">
  <mat-card-content>
    <app-data-table
      [columns]="columns"
      [data]="recipes()"
      [actions]="actions"
      emptyMessage="No recipes yet. Add one to get started."
    />
  </mat-card-content>
</mat-card>
